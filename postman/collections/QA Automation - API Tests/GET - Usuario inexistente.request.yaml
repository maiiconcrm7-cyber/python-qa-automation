$kind: http-request
url: https://jsonplaceholder.typicode.com/users/999999
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Usuario inexistente retorna 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Usuario inexistente retorna JSON vazio\", function () {\r

      \    const dados = pm.response.json();\r

      \r

      \    pm.expect(dados).to.deep.equal({});\r

      });\r\n"
    language: text/javascript
order: 4000
